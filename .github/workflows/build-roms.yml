name: Build S3CE ROMs

on:
  push:
    branches:
      - Clone-Driver-v2
      - flamedriver

    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - '_CD/**'
      - 'Engine/_examples/**'
      - 'Projects/**'
      - 'Utilities/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set branch variable
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV

      - name: Make scripts executable
        run: chmod +x build.sh build_debug.sh

      - name: Run build.sh
        run: ./build.sh

      - name: Run build_debug.sh
        run: ./build_debug.sh

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: ROMs-${{ env.BRANCH_NAME }}
          path: |
            S3CE.gen
            S3CE.debug.gen
